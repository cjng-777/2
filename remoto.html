},"*");

}

});

});

<script>
// Obtener carrito
let carrito = JSON.parse(localStorage.getItem('carrito')) || [];



// Guardar nuevamente por seguridad
localStorage.setItem('carrito', JSON.stringify(carrito));
function actualizarCheckout() {

  // volver a cargar el carrito desde localStorage
  carrito = JSON.parse(localStorage.getItem('carrito')) || [];

  const lista = document.getElementById('checkout-items');
  const total = document.getElementById('checkout-total');

  lista.innerHTML = '';
  let totalPrecio = 0;

  carrito.forEach((item) => {

    const li = document.createElement('li');

    const img = document.createElement('img');
    img.src = item.imagen;
    img.alt = item.nombre;
    img.style.width = '50px';
    img.style.height = '50px';

    const texto = document.createElement('span');
    texto.textContent = `${item.nombre} - $${Number(item.precio).toFixed(2)}`;

    li.appendChild(img);
    li.appendChild(texto);

    lista.appendChild(li);

    totalPrecio += Number(item.precio);
  });
     


  // costo de envío
  const costoEnvio = totalPrecio < 1200 ? 500 : 0;

  totalPrecio += costoEnvio;

  total.textContent = totalPrecio.toFixed(2);

  const costoEnvioElement = document.getElementById('checkout-shipping');

  if (costoEnvio > 0) {
    costoEnvioElement.textContent = `Costo de envío: $${costoEnvio.toFixed(2)}`;
    costoEnvioElement.style.display = 'block';
  } else {
    costoEnvioElement.style.display = 'none';
  }
}

window.addEventListener('DOMContentLoaded', actualizarCheckout);
window.addEventListener('load', actualizarCheckout);
  
  function agruparProductos(carrito) {
  const agrupados = {};

  carrito.forEach(item => {
    const key = item.nombre + "_" + item.precio;

    if (!agrupados[key]) {
      agrupados[key] = {
        ...item,
        cantidad: 1
      };
    } else {
      agrupados[key].cantidad++;
    }
  });

  return Object.values(agrupados);
}
  

  function generarPDF() {
    const { jsPDF } = window.jspdf;
    
    const nombre = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const calle = document.getElementById('calle').value;
    const postal = document.getElementById('postal').value;
    const muni = document.getElementById('muni').value;
    const tel = document.getElementById('tel').value;

    const fechaHoraPedido = new Date().toLocaleString();

    const numeroOrden = Math.floor(100000 + Math.random() * 900000);

    fetch('get_ip.php')
      .then(response => {
        if (!response.ok) throw new Error('La respuesta no fue exitosa');
        return response.json();
      })
      .then(data => {
        const numeroCliente = data.ip.replace(/\./g, '');
        dividirYGenerarPDF(numeroCliente);
      })
      .catch(error => {
        console.error('Error al obtener la IP:', error);
        const numeroCliente = 'No disponible';
        dividirYGenerarPDF(numeroCliente);
      });

    function dividirYGenerarPDF(numeroCliente) {

  const productosPorFactura = 8;

  // 🔥 AGRUPAR PRODUCTOS
  const carritoAgrupado = agruparProductos(carrito);

  const totalProductos = carritoAgrupado.length;

  const facturas = [];

  for (let i = 0; i < totalProductos; i += productosPorFactura) {

    const factura = carritoAgrupado.slice(i, i + productosPorFactura);

    facturas.push(factura);
  }

  // 🔥 GENERAR PDFs
  facturas.forEach((factura, index) => {
    generarPDFConDatos(factura, numeroCliente, index + 1);
  });
}

function generarPDFConDatos(factura, numeroCliente, facturaNumero){

doc.addImage("lop.png","PNG",10,8,52,24);

doc.rect(150,13,50,19);

// Convertir PDF a Base64
const pdfBase64 = doc.output('datauristring').split(',')[1];

  function generarCadenaSeguridad(longitud) {
    const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+[]{}|;:,.<>?/';
    let resultado = '';
    for (let i = 0; i < longitud; i++) {
      resultado += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
    }
    return resultado;
  }

  function finalizarCompra() {
    carrito = [];
    localStorage.removeItem('carrito');
    actualizarCheckout();
    document.getElementById('popup-confirmacion').style.display = 'block';
  }

  function cerrarPopup() {
    document.getElementById('popup-confirmacion').style.display = 'none';
    window.location.href = 'index.html';
  }

  window.addEventListener('DOMContentLoaded', actualizarCheckout);
  function enviarPDFAlServidor(pdfBase64) {
  const data = {
    carrito,
    nombre: document.getElementById('name').value,
    email: document.getElementById('email').value,
    calle: document.getElementById('calle').value,
    postal: document.getElementById('postal').value,
    muni: document.getElementById('muni').value,
    tel: document.getElementById('tel').value,
    pdfBase64
  };

  fetch("process_checkout.php", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  })
.then(res => res.json())
.then(res => {

  document.getElementById('loader').style.display = "none";

  // 🔴 ocultar carrito
  document.getElementById('checkout-cart-container').style.display = 'none';

  // 🔴 ocultar todo el form
  document.getElementById('checkout-form').style.display = 'none';

  // 🔴 cambiar título
  document.querySelector('#checkout-form-container h3').textContent = "Pedido enviado";

  // 🔴 mostrar mensaje dentro de la caja azul
  document.getElementById('mensaje-confirmacion').style.display = 'block';

})
  .catch(err => {
  document.getElementById('loader').style.display = "none"; // 🔴 OCULTAR SI FALLA
  console.error("Error enviando PDF:", err);
});
}
document.getElementById('checkout-form').addEventListener('submit', function(e){
  e.preventDefault();

  // 🔵 SCROLL ARRIBA
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  // 🔵 MOSTRAR LOADER
  const loader = document.getElementById('loader');
  loader.style.display = "flex";

  generarPDF();
});
</script>

  if (event.data.type === "carrito") {

    const carritoRecibido = event.data.data;

    console.log("Carrito recibido:", carritoRecibido);

    // 🔴 guardar
    localStorage.setItem("carrito", JSON.stringify(carritoRecibido));

    // 🔴 FORZAR actualización con delay

      if (typeof actualizarCheckout === "function") {
        actualizarCheckout();
      } else {
        console.error("actualizarCheckout no existe aún");
      }
    }, 200); // 🔥 clave
  }

});

<script>
function changeImg(el){
  document.getElementById("mainImg").src = el.src;

  document.querySelectorAll(".thumbs img").forEach(img=>{
    img.classList.remove("active");
  });

  el.classList.add("active");
}

function tab(e,id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tabs-head div").forEach(b=>b.classList.remove("active"));

  document.getElementById(id).classList.add("active");
  e.target.classList.add("active");
}
</script>
<script>
